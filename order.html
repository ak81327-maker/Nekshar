<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Place Order | Nekshar Agarbatti</title>

  <meta
    name="description"
    content="Place your Nekshar Agarbatti order - Bhakti Ki Pahchan"
  >

  <meta
    name="theme-color"
    content="#5b2418"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    /* ================= ORDER PAGE ================= */

    .order-page {
      min-height: 80vh;
      padding: 65px 0 90px;
      background: #fffaf4;
    }

    .order-heading {
      text-align: center;
      margin-bottom: 40px;
    }

    .order-heading p {
      color: #8a4b35;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .order-heading h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 6vw, 55px);
      line-height: 1.1;
    }

    .order-heading span {
      display: block;
      width: 50px;
      height: 2px;
      background: #7b301e;
      margin: 18px auto 0;
    }


    /* LAYOUT */

    .order-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 30px;
      align-items: start;
    }


    /* FORM */

    .order-form-box {
      background: #ffffff;
      border: 1px solid #eadbd0;
      border-radius: 15px;
      padding: 30px;
    }

    .order-form-box h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      margin-bottom: 25px;
    }


    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }


    .form-group {
      margin-bottom: 18px;
    }


    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }


    .form-group input,
    .form-group textarea,
    .form-group select {

      width: 100%;

      border: 1px solid #d9c8bb;

      background: #fffdfb;

      color: #35170f;

      padding: 13px 14px;

      border-radius: 7px;

      outline: none;

      font-family: inherit;

      font-size: 14px;

    }


    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {

      border-color: #7b301e;

      box-shadow:
        0 0 0 3px
        rgba(123, 48, 30, 0.08);

    }


    .form-group textarea {

      min-height: 110px;

      resize: vertical;

    }


    .required {
      color: #a0442e;
    }


    /* ORDER SUMMARY */

    .order-summary {

      background: #ffffff;

      border: 1px solid #eadbd0;

      border-radius: 15px;

      padding: 25px;

      position: sticky;

      top: 100px;

    }


    .order-summary h2 {

      font-family: Georgia, "Times New Roman", serif;

      font-size: 27px;

      margin-bottom: 20px;

    }


    .summary-product {

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 12px 0;

      border-bottom:
        1px solid #eee1d7;

    }


    .summary-product-image {

      width: 55px;

      height: 55px;

      flex-shrink: 0;

      border-radius: 8px;

      overflow: hidden;

      background: #f2e4d7;

    }


    .summary-product-image img {

      width: 100%;

      height: 100%;

      object-fit: cover;

    }


    .summary-product-info {

      flex: 1;

    }


    .summary-product-info h3 {

      font-size: 14px;

      margin-bottom: 2px;

    }


    .summary-product-info p {

      color: #765e54;

      font-size: 12px;

    }


    .summary-product-total {

      font-size: 13px;

      font-weight: 700;

    }


    .summary-total {

      display: flex;

      justify-content: space-between;

      padding: 20px 0;

      font-size: 20px;

      font-weight: 800;

    }


    .summary-total span:last-child {

      color: #7b301e;

    }


    /* PLACE ORDER */

    .place-order-button {

      width: 100%;

      border: 0;

      background: #5b2418;

      color: #ffffff;

      padding: 15px 18px;

      border-radius: 8px;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.25s ease;

    }


    .place-order-button:hover {

      background: #7b301e;

      transform: translateY(-2px);

    }


    .secure-note {

      text-align: center;

      color: #765e54;

      font-size: 11px;

      margin-top: 13px;

    }


    /* EMPTY */

    .order-empty {

      background: #ffffff;

      border: 1px solid #eadbd0;

      border-radius: 15px;

      padding: 70px 20px;

      text-align: center;

    }


    .order-empty h2 {

      font-family: Georgia, "Times New Roman", serif;

      margin-bottom: 10px;

    }


    .order-empty p {

      color: #765e54;

      margin-bottom: 22px;

    }


    .order-empty a {

      display: inline-block;

      background: #5b2418;

      color: #ffffff;

      padding: 12px 25px;

      border-radius: 30px;

      font-weight: 700;

    }


    /* MOBILE */

    @media (max-width: 850px) {

      .order-layout {

        grid-template-columns: 1fr;

      }

      .order-summary {

        position: static;

      }

    }


    @media (max-width: 550px) {

      .order-page {

        padding: 50px 0 70px;

      }

      .order-form-box {

        padding: 20px;

      }

      .form-row {

        grid-template-columns: 1fr;

        gap: 0;

      }

    }

  </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

  <div class="container nav">

    <a
      href="index.html"
      class="logo"
    >

      <span class="logo-main">
        NEKSHAR
      </span>

      <span class="logo-sub">
        BHAKTI KI PAHCHAN
      </span>

    </a>


    <nav class="menu">

      <a href="index.html">
        Home
      </a>

      <a href="index.html#shop">
        Shop
      </a>

      <a href="index.html#about">
        About
      </a>

      <a href="index.html#contact">
        Contact
      </a>

    </nav>


    <a
      href="cart.html"
      class="cart-button"
    >

      🛒 Cart

      <span id="cartCount">
        0
      </span>

    </a>

  </div>

</header>


<!-- ================= ORDER PAGE ================= -->

<main class="order-page">

  <div class="container">


    <div class="order-heading">

      <p>
        NEKSHAR
      </p>

      <h1>
        Place Your Order
      </h1>

      <span></span>

    </div>


    <div id="orderPageContent">


      <!-- JAVASCRIPT WILL LOAD CONTENT -->

    </div>


  </div>

</main>


<!-- ================= FOOTER ================= -->

<footer class="footer">

  <div class="container footer-content">

    <div>

      <div class="footer-logo">
        NEKSHAR
      </div>

      <p>
        Bhakti Ki Pahchan
      </p>

    </div>


    <div class="footer-links">

      <a href="index.html">
        Home
      </a>

      <a href="index.html#shop">
        Shop
      </a>

      <a href="index.html#about">
        About
      </a>

      <a href="index.html#contact">
        Contact
      </a>

    </div>

  </div>


  <div class="copyright">

    © 2026 Nekshar Agarbatti.
    All Rights Reserved.

  </div>

</footer>


<!-- ================= ORDER JAVASCRIPT ================= -->

<script>

const CART_KEY = "neksharCart";


/* GET CART */

function getCart() {

  try {

    const cart =
      JSON.parse(
        localStorage.getItem(CART_KEY)
      );

    return Array.isArray(cart)
      ? cart
      : [];

  } catch(error) {

    return [];

  }

}


/* UPDATE CART COUNT */

function updateCartCount() {

  const cart = getCart();

  let count = 0;


  cart.forEach(function(item) {

    count += Number(item.quantity) || 1;

  });


  const element =
    document.getElementById(
      "cartCount"
    );


  if(element) {

    element.textContent = count;

  }

}


/* LOAD ORDER PAGE */

function loadOrderPage() {

  const cart = getCart();

  const container =
    document.getElementById(
      "orderPageContent"
    );


  if(!container) return;


  /* EMPTY CART */

  if(cart.length === 0) {

    container.innerHTML = `

      <div class="order-empty">

        <h2>
          Your Cart Is Empty
        </h2>

        <p>
          Please add a product before
          placing an order.
        </p>

        <a href="index.html#shop">
          Shop Now
        </a>

      </div>

    `;

    return;

  }


  let subtotal = 0;

  let productsHTML = "";


  cart.forEach(function(item) {

    const quantity =
      Number(item.quantity) || 1;

    const price =
      Number(item.price) || 0;

    const total =
      price * quantity;


    subtotal += total;


    productsHTML += `

      <div class="summary-product">

        <div class="summary-product-image">

          <img
            src="${item.image || ''}"
            alt="${item.name}"
            onerror="this.style.display='none'"
          >

        </div>


        <div class="summary-product-info">

          <h3>
            ${item.name}
          </h3>

          <p>
            ₹${price} × ${quantity}
          </p>

        </div>


        <div class="summary-product-total">

          ₹${total}

        </div>

      </div>

    `;

  });


  container.innerHTML = `

    <div class="order-layout">


      <!-- FORM -->

      <div class="order-form-box">

        <h2>
          Delivery Details
        </h2>


        <form
          id="orderForm"
          onsubmit="submitOrder(event)"
        >


          <div class="form-row">


            <div class="form-group">

              <label>
                Full Name
                <span class="required">*</span>
              </label>

              <input
                type="text"
                id="customerName"
                placeholder="Enter your name"
                autocomplete="name"
                required
              >

            </div>


            <div class="form-group">

              <label>
                Mobile Number
                <span class="required">*</span>
              </label>

              <input
                type="tel"
                id="customerPhone"
                placeholder="10 digit mobile number"
                inputmode="numeric"
                maxlength="10"
                autocomplete="tel"
                required
              >

            </div>


          </div>


          <div class="form-group">

            <label>
              Complete Address
              <span class="required">*</span>
            </label>

            <textarea
              id="customerAddress"
              placeholder="House No., Street, Area..."
              autocomplete="street-address"
              required
            ></textarea>

          </div>


          <div class="form-row">


            <div class="form-group">

              <label>
                City
                <span class="required">*</span>
              </label>

              <input
                type="text"
                id="customerCity"
                placeholder="Enter city"
                autocomplete="address-level2"
                required
              >

            </div>


            <div class="form-group">

              <label>
                State
                <span class="required">*</span>
              </label>

              <input
                type="text"
                id="customerState"
                placeholder="Enter state"
                autocomplete="address-level1"
                required
              >

            </div>


          </div>


          <div class="form-row">


            <div class="form-group">

              <label>
                PIN Code
                <span class="required">*</span>
              </label>

              <input
                type="tel"
                id="customerPin"
                placeholder="6 digit PIN code"
                inputmode="numeric"
                maxlength="6"
                autocomplete="postal-code"
                required
              >

            </div>


            <div class="form-group">

              <label>
                Landmark
              </label>

              <input
                type="text"
                id="customerLandmark"
                placeholder="Nearby landmark (optional)"
                autocomplete="off"
              >

            </div>


          </div>


          <button
            type="submit"
            class="place-order-button"
          >

            Place Order →

          </button>


          <p class="secure-note">

            🔒 Your details are used only
            for order processing.

          </p>


        </form>

      </div>


      <!-- SUMMARY -->

      <aside class="order-summary">

        <h2>
          Your Order
        </h2>


        ${productsHTML}


        <div class="summary-total">

          <span>
            Total
          </span>

          <span>
            ₹${subtotal}
          </span>

        </div>


      </aside>


    </div>

  `;


  updateCartCount();

}


/* ================= SUBMIT ORDER ================= */

function submitOrder(event) {

  event.preventDefault();


  const name =
    document.getElementById(
      "customerName"
    ).value.trim();


  const phone =
    document.getElementById(
      "customerPhone"
    ).value.trim();


  const address =
    document.getElementById(
      "customerAddress"
    ).value.trim();


  const city =
    document.getElementById(
      "customerCity"
    ).value.trim();


  const state =
    document.getElementById(
      "customerState"
    ).value.trim();


  const pin =
    document.getElementById(
      "customerPin"
    ).value.trim();


  const landmark =
    document.getElementById(
      "customerLandmark"
    ).value.trim();


  /* PHONE CHECK */

  if(!/^[6-9][0-9]{9}$/.test(phone)) {

    alert(
      "Please enter a valid 10 digit mobile number."
    );

    return;

  }


  /* PIN CHECK */

  if(!/^[0-9]{6}$/.test(pin)) {

    alert(
      "Please enter a valid 6 digit PIN code."
    );

    return;

  }


  const cart = getCart();


  if(cart.length === 0) {

    alert(
      "Cart is empty."
    );

    return;

  }


  let subtotal = 0;

  let orderItems = "";


  cart.forEach(function(item) {

    const quantity =
      Number(item.quantity) || 1;

    const price =
      Number(item.price) || 0;

    const total =
      price * quantity;


    subtotal += total;


    orderItems +=
      item.name +
      " x " +
      quantity +
      " = ₹" +
      total +
      "\n";

  });


  let message =

    "🙏 *NEKSHAR AGARBATTI ORDER*" +

    "\n" +
    "Bhakti Ki Pahchan" +

    "\n\n" +

    "*Customer Details*" +

    "\nName: " +
    name +

    "\nMobile: " +
    phone +

    "\nAddress: " +
    address +

    "\nCity: " +
    city +

    "\nState: " +
    state +

    "\nPIN: " +
    pin;


  if(landmark) {

    message +=
      "\nLandmark: " +
      landmark;

  }


  message +=

    "\n\n" +

    "*Order Details*" +

    "\n" +

    orderItems +

    "\n*Total: ₹" +
    subtotal +
    "*" +

    "\n\n" +

    "Thank you for choosing Nekshar 🙏";


  /*
    IMPORTANT:
    नीचे अपना WhatsApp number डालना है.
    91 के बाद 10 digit mobile number.
    Example:
    919876543210
  */

  const whatsappNumber =
    "918287548936";


  if(
    whatsappNumber.includes("X")
  ) {

    alert(
      "Order WhatsApp number अभी set नहीं किया गया है."
    );

    return;

  }


  const whatsappURL =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);


  /*
    Order data temporarily save.
    आगे success page के लिए इस्तेमाल होगा.
  */

  localStorage.setItem(
    "neksharLastOrder",
    JSON.stringify({

      name: name,

      phone: phone,

      address: address,

      city: city,

      state: state,

      pin: pin,

      landmark: landmark,

      total: subtotal,

      items: cart,

      orderTime:
        new Date().toISOString()

    })
  );


  window.location.href =
    whatsappURL;

}


/* ================= START ================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadOrderPage();

  }
);

</script>


</body>
</html>
