<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nekshar Agarbatti | Place Your Order</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#faf7f2;
    color:#292522;
}

/* HEADER */
header{
    background:linear-gradient(135deg,#8b0000,#b51212);
    color:white;
    padding:18px 20px 20px;
    box-shadow:0 3px 15px rgba(0,0,0,.18);
}

.header-inner{
    max-width:1100px;
    margin:auto;
}

.logo{
    text-align:center;
    font-family:Georgia,serif;
    font-size:30px;
    font-weight:bold;
    letter-spacing:2px;
}

.tagline{
    text-align:center;
    margin-top:6px;
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
}

nav{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:26px;
    margin-top:20px;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:16px;
    font-weight:600;
}

.cart-link{
    background:white;
    color:#8b0000 !important;
    padding:8px 14px;
    border-radius:25px;
}

/* MAIN */
main{
    max-width:900px;
    margin:auto;
    padding:48px 16px 70px;
}

.page-heading{
    text-align:center;
    margin-bottom:35px;
}

.small-title{
    color:#8b0000;
    font-size:13px;
    letter-spacing:4px;
    font-weight:bold;
    margin-bottom:12px;
}

.page-heading h1{
    font-family:Georgia,serif;
    font-size:44px;
}

.heading-line{
    width:70px;
    height:3px;
    background:#8b0000;
    margin:18px auto 0;
    border-radius:5px;
}

/* CARD */
.order-card{
    background:white;
    border-radius:22px;
    padding:34px;
    box-shadow:0 8px 30px rgba(70,40,20,.10);
    border:1px solid #eadfd4;
}

.order-card h2{
    font-family:Georgia,serif;
    font-size:32px;
    margin-bottom:25px;
}

/* FORM */
.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    font-size:15px;
    font-weight:bold;
    margin-bottom:8px;
}

.required{
    color:#a00000;
}

input,
textarea{
    width:100%;
    border:1px solid #d8cec5;
    background:#fffdfb;
    border-radius:12px;
    padding:15px 16px;
    font-size:16px;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:#9b1717;
    box-shadow:0 0 0 3px rgba(155,23,23,.08);
}

textarea{
    min-height:110px;
    resize:vertical;
}

/* SUMMARY */
.summary{
    background:#fff8f3;
    border:1px solid #ead8cc;
    border-radius:15px;
    padding:20px;
    margin:25px 0;
}

.summary h3{
    font-family:Georgia,serif;
    font-size:22px;
    color:#7e1717;
    margin-bottom:15px;
}

.product-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #ead8cc;
}

.product-name{
    font-weight:bold;
}

.product-price{
    white-space:nowrap;
}

.total-row{
    display:flex;
    justify-content:space-between;
    font-size:20px;
    font-weight:bold;
    margin-top:16px;
    color:#8b0000;
}

/* BUTTON */
.submit-btn{
    width:100%;
    border:none;
    background:linear-gradient(135deg,#8b0000,#bd1717);
    color:white;
    padding:16px 20px;
    border-radius:30px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 6px 15px rgba(139,0,0,.20);
}

.submit-btn:disabled{
    background:#999;
    cursor:not-allowed;
    box-shadow:none;
}

/* FOOTER */
footer{
    background:#2b211d;
    color:white;
    text-align:center;
    padding:25px 15px;
}

footer strong{
    font-family:Georgia,serif;
    letter-spacing:1px;
}

footer p{
    margin-top:7px;
    font-size:13px;
    opacity:.8;
}

/* MOBILE */
@media(max-width:600px){

    header{
        padding:17px 14px 19px;
    }

    .logo{
        font-size:25px;
    }

    .tagline{
        font-size:11px;
        letter-spacing:2px;
    }

    nav{
        gap:10px;
        margin-top:17px;
    }

    nav a{
        font-size:14px;
        padding:7px 8px;
    }

    .cart-link{
        padding:7px 12px;
    }

    main{
        padding:38px 12px 55px;
    }

    .page-heading h1{
        font-size:35px;
    }

    .order-card{
        padding:22px 17px;
        border-radius:18px;
    }

    .order-card h2{
        font-size:28px;
    }

    .product-row{
        font-size:14px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            NEKSHAR
        </div>

        <div class="tagline">
            Bhakti Ki Pahchan
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>

            <a href="cart.html" class="cart-link">
                🛒 Cart <span id="cartCount">0</span>
            </a>
        </nav>

    </div>
</header>


<main>

    <section class="page-heading">

        <div class="small-title">
            NEKSHAR
        </div>

        <h1>
            Place Your Order
        </h1>

        <div class="heading-line"></div>

    </section>


    <section class="order-card">

        <h2>
            Delivery Details
        </h2>


        <form id="orderForm">

            <div class="form-group">
                <label>
                    Full Name <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required>
            </div>


            <div class="form-group">
                <label>
                    Mobile Number <span class="required">*</span>
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="10 digit mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    required>
            </div>


            <div class="form-group">
                <label>
                    Complete Address <span class="required">*</span>
                </label>

                <textarea
                    id="address"
                    placeholder="House No., Street, Area, Locality..."
                    required></textarea>
            </div>


            <div class="form-group">
                <label>
                    City <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="city"
                    placeholder="Enter your city"
                    required>
            </div>


            <div class="form-group">
                <label>
                    State <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="state"
                    placeholder="Enter your state"
                    required>
            </div>


            <div class="form-group">
                <label>
                    PIN Code <span class="required">*</span>
                </label>

                <input
                    type="tel"
                    id="pincode"
                    placeholder="6 digit PIN code"
                    maxlength="6"
                    inputmode="numeric"
                    required>
            </div>


            <!-- ORDER SUMMARY -->

            <div class="summary">

                <h3>
                    Order Summary
                </h3>

                <div id="orderSummary">
                    Loading your order...
                </div>

                <div class="total-row">
                    <span>Total</span>
                    <span id="orderTotal">₹0</span>
                </div>

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="placeOrderBtn">

                Place Order

            </button>

        </form>

    </section>

</main>


<footer>

    <strong>NEKSHAR AGARBATTI</strong>

    <p>
        Bhakti Ki Pahchan
    </p>

    <p>
        © 2026 Nekshar. All Rights Reserved.
    </p>

</footer>


<script>

/* =====================================================
   NEKSHAR AGARBATTI
   ORDER PAGE
===================================================== */


/* ================= CART ================= */

function getCart(){

    try{

        const cart = JSON.parse(
            localStorage.getItem("cart")
        );

        return Array.isArray(cart) ? cart : [];

    }catch(error){

        return [];

    }

}


/* ================= CART COUNT ================= */

function updateCartCount(){

    const cart = getCart();

    let count = 0;

    cart.forEach(item => {

        count += Number(item.quantity || 1);

    });

    const cartCount =
        document.getElementById("cartCount");

    if(cartCount){

        cartCount.textContent = count;

    }

}


/* ================= ORDER SUMMARY ================= */

function showOrderSummary(){

    const cart = getCart();

    const summary =
        document.getElementById("orderSummary");

    const totalElement =
        document.getElementById("orderTotal");

    const button =
        document.getElementById("placeOrderBtn");


    if(cart.length === 0){

        summary.innerHTML = `
            <p style="color:#8b0000;font-weight:bold;">
                Your cart is currently empty.
            </p>

            <p style="margin-top:8px;">
                Please add a product before placing your order.
            </p>
        `;

        totalElement.textContent = "₹0";

        button.disabled = true;

        return;

    }


    let total = 0;

    let html = "";


    cart.forEach(item => {

        const name =
            item.name ||
            item.title ||
            "Product";


        const quantity =
            Number(item.quantity || 1);


        const price =
            Number(
                item.price ||
                item.productPrice ||
                15
            );


        const itemTotal =
            price * quantity;


        total += itemTotal;


        html += `

            <div class="product-row">

                <div>

                    <div class="product-name">
                        ${name}
                    </div>

                    <div>
                        Quantity: ${quantity}
                    </div>

                </div>

                <div class="product-price">
                    ₹${itemTotal}
                </div>

            </div>

        `;

    });


    summary.innerHTML = html;

    totalElement.textContent =
        "₹" + total;

}


/* ================= INPUT CONTROL ================= */

document
.getElementById("mobile")
.addEventListener("input",function(){

    this.value =
        this.value
        .replace(/[^0-9]/g,"")
        .slice(0,10);

});


document
.getElementById("pincode")
.addEventListener("input",function(){

    this.value =
        this.value
        .replace(/[^0-9]/g,"")
        .slice(0,6);

});


/* ================= PLACE ORDER ================= */

document
.getElementById("orderForm")
.addEventListener("submit",function(event){

    event.preventDefault();


    const cart = getCart();


    /* CART CHECK */

    if(cart.length === 0){

        alert(
            "Your cart is empty. Please add a product first."
        );

        return;

    }


    /* CUSTOMER DETAILS */

    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const mobile =
        document
        .getElementById("mobile")
        .value
        .trim();


    const address =
        document
        .getElementById("address")
        .value
        .trim();


    const city =
        document
        .getElementById("city")
        .value
        .trim();


    const state =
        document
        .getElementById("state")
        .value
        .trim();


    const pincode =
        document
        .getElementById("pincode")
        .value
        .trim();


    /* VALIDATION */

    if(!/^[0-9]{10}$/.test(mobile)){

        alert(
            "Please enter a valid 10 digit mobile number."
        );

        return;

    }


    if(!/^[0-9]{6}$/.test(pincode)){

        alert(
            "Please enter a valid 6 digit PIN code."
        );

        return;

    }


    /* ================= TOTAL ================= */

    let total = 0;

    cart.forEach(item => {

        const quantity =
            Number(item.quantity || 1);

        const price =
            Number(
                item.price ||
                item.productPrice ||
                15
            );

        total += price * quantity;

    });


    /* ================= SAVE ORDER ================= */

    const order = {

        orderId:
            "NK" +
            Date.now(),

        date:
            new Date().toLocaleString("en-IN"),

        customer:{

            name:name,

            mobile:mobile,

            address:address,

            city:city,

            state:state,

            pincode:pincode

        },

        products:cart,

        total:total,

        paymentMethod:"Cash on Delivery"

    };


    /* SAVE ORDER */

    localStorage.setItem(
        "lastOrder",
        JSON.stringify(order)
    );


    /* ================= WHATSAPP MESSAGE ================= */

    let message = "";

    message +=
        "🪔 *NEW ORDER - NEKSHAR AGARBATTI*";

    message +=
        "\n\nOrder ID: " +
        order.orderId;


    message +=
        "\n\n*Customer Details*";

    message +=
        "\nName: " +
        name;

    message +=
        "\nMobile: " +
        mobile;

    message +=
        "\nAddress: " +
        address;

    message +=
        "\nCity: " +
        city;

    message +=
        "\nState: " +
        state;

    message +=
        "\nPIN: " +
        pincode;


    message +=
        "\n\n*Products*";


    cart.forEach(item => {

        const productName =
            item.name ||
            item.title ||
            "Product";

        const quantity =
            Number(item.quantity || 1);

        const price =
            Number(
                item.price ||
                item.productPrice ||
                15
            );

        message +=
            "\n" +
            productName +
            " × " +
            quantity +
            " = ₹" +
            (price * quantity);

    });


    message +=
        "\n\n*TOTAL: ₹" +
        total +
        "*";


    message +=
        "\nPayment: Cash on Delivery";


    /* ================= WHATSAPP ================= */

    /*
       IMPORTANT:
       Neeche apna WhatsApp number daalein.

       Example:
       919876543210

       + sign mat lagana.
    */

    const whatsappNumber =
        "918287548936";


    const whatsappURL =
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        encodeURIComponent(message);


    /* ================= SAVE CUSTOMER ================= */

    localStorage.setItem(
        "customerName",
        name
    );

    localStorage.setItem(
        "customerMobile",
        mobile
    );

    localStorage.setItem(
        "customerAddress",
        address
    );


    /* ================= OPEN WHATSAPP ================= */

    window.open(
        whatsappURL,
        "_blank"
    );


    /* ================= SUCCESS PAGE ================= */

    setTimeout(function(){

        window.location.href =
            "success.html";

    },500);

});


/* ================= START ================= */

updateCartCount();

showOrderSummary();

</script>

</body>
</html>
