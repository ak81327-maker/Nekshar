<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Nekshar Agarbatti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Nekshar Agarbatti</h1>
</header>

<section class="products-section">

    <h2>Checkout</h2>

    <form id="checkoutForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required>

        <br><br>

        <input
            type="tel"
            id="mobile"
            placeholder="Mobile Number"
            required>

        <br><br>

        <textarea
            id="address"
            placeholder="Delivery Address"
            rows="5"
            required></textarea>

        <br><br>

        <button type="submit">
            Place Order
        </button>

    </form>

</section>

<script src="checkout.js"></script>

</body>
</html>
