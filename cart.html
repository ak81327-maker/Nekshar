<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nekshar | Your Cart</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#faf7f2;
  color:#241b18;
}

/* HEADER */
header{
  background:#9d1717;
  color:white;
  padding:15px 5%;
  box-shadow:0 3px 15px rgba(0,0,0,.18);
}

.navbar{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  text-decoration:none;
  color:white;
  font-family:Georgia,serif;
  font-size:25px;
  font-weight:bold;
  letter-spacing:2px;
  white-space:nowrap;
}

.logo span{
  display:block;
  font-size:11px;
  letter-spacing:3px;
  color:#f4d58d;
  margin-top:3px;
}

nav{
  display:flex;
  align-items:center;
  gap:25px;
}

nav a{
  color:white;
  text-decoration:none;
  font-size:15px;
  font-weight:600;
}

nav a:hover{
  color:#f4d58d;
}

.cart-link{
  border:1px solid rgba(255,255,255,.5);
  padding:9px 14px;
  border-radius:25px;
}

/* MOBILE HEADER */
@media(max-width:700px){

  header{
    padding:13px 15px;
  }

  .navbar{
    display:block;
  }

  .logo{
    display:block;
    text-align:center;
    font-size:23px;
  }

  .logo span{
    font-size:10px;
  }

  nav{
    margin-top:13px;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
  }

  nav a{
    font-size:13px;
  }

  .cart-link{
    padding:7px 11px;
  }
}

/* HERO */
.cart-hero{
  text-align:center;
  padding:55px 20px 35px;
}

.small-title{
  color:#a32920;
  letter-spacing:5px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:10px;
}

.cart-hero h1{
  font-family:Georgia,serif;
  font-size:48px;
  color:#251b18;
}

.line{
  width:65px;
  height:3px;
  background:#a32920;
  margin:18px auto;
}

.cart-hero p{
  color:#777;
  font-size:14px;
}

/* CART AREA */
.cart-container{
  max-width:1100px;
  margin:10px auto 60px;
  padding:0 18px;
  display:grid;
  grid-template-columns:1fr 330px;
  gap:25px;
}

/* PRODUCT LIST */
.cart-items{
  background:white;
  border-radius:16px;
  overflow:hidden;
  border:1px solid #eadfd4;
  box-shadow:0 8px 25px rgba(80,40,20,.07);
}

.cart-item{
  display:flex;
  align-items:center;
  gap:22px;
  padding:22px;
  border-bottom:1px solid #eee4da;
}

.cart-item:last-child{
  border-bottom:none;
}

.product-img{
  width:115px;
  height:115px;
  object-fit:contain;
  border-radius:12px;
  background:#f5eee7;
  padding:8px;
}

.product-info{
  flex:1;
}

.product-info h2{
  font-family:Georgia,serif;
  font-size:21px;
  margin-bottom:7px;
}

.product-price{
  color:#a32920;
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

/* QUANTITY */
.quantity{
  display:flex;
  width:135px;
  height:42px;
  border:1px solid #d8c8bb;
  border-radius:10px;
  overflow:hidden;
}

.quantity button{
  width:42px;
  border:0;
  background:#f8eee7;
  color:#8d241d;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
}

.quantity span{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

.remove{
  display:inline-block;
  margin-top:10px;
  color:#9d1717;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

.item-total{
  font-family:Georgia,serif;
  font-size:20px;
  font-weight:bold;
  white-space:nowrap;
}

/* SUMMARY */
.summary{
  background:#fff;
  border-radius:16px;
  padding:25px;
  height:max-content;
  border:1px solid #eadfd4;
  box-shadow:0 8px 25px rgba(80,40,20,.07);
  position:sticky;
  top:15px;
}

.summary h2{
  font-family:Georgia,serif;
  font-size:24px;
  margin-bottom:22px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  color:#555;
}

.summary-total{
  display:flex;
  justify-content:space-between;
  border-top:1px solid #e5d8cd;
  margin-top:10px;
  padding-top:18px;
  font-size:21px;
  font-weight:bold;
}

.checkout{
  display:block;
  width:100%;
  margin-top:22px;
  background:#9d1717;
  color:white;
  text-align:center;
  text-decoration:none;
  padding:15px;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  letter-spacing:.5px;
  transition:.2s;
}

.checkout:hover{
  background:#781010;
}

.continue{
  display:block;
  text-align:center;
  margin-top:15px;
  color:#9d1717;
  text-decoration:none;
  font-size:14px;
  font-weight:bold;
}

/* EMPTY CART */
.empty{
  text-align:center;
  padding:60px 20px;
}

.empty-icon{
  font-size:55px;
  margin-bottom:15px;
}

.empty h2{
  font-family:Georgia,serif;
  margin-bottom:8px;
}

.empty p{
  color:#777;
  margin-bottom:20px;
}

/* FOOTER */
footer{
  background:#241b18;
  color:white;
  text-align:center;
  padding:25px 15px;
}

footer strong{
  color:#f4d58d;
}

/* MOBILE CART */
@media(max-width:800px){

  .cart-hero{
    padding:40px 15px 25px;
  }

  .cart-hero h1{
    font-size:38px;
  }

  .cart-container{
    display:block;
    padding:0 10px;
  }

  .cart-items{
    margin-bottom:20px;
  }

  .cart-item{
    padding:16px 12px;
    gap:12px;
    align-items:flex-start;
  }

  .product-img{
    width:90px;
    height:90px;
  }

  .product-info h2{
    font-size:17px;
  }

  .product-price{
    font-size:16px;
    margin-bottom:8px;
  }

  .quantity{
    width:120px;
    height:38px;
  }

  .quantity button{
    width:38px;
  }

  .item-total{
    display:none;
  }

  .summary{
    position:static;
    margin-bottom:30px;
  }
}

@media(max-width:400px){

  .logo{
    font-size:20px;
  }

  nav{
    gap:8px;
  }

  nav a{
    font-size:12px;
  }

  .cart-hero h1{
    font-size:34px;
  }

  .product-img{
    width:78px;
    height:78px;
  }

  .product-info h2{
    font-size:16px;
  }
}
</style>
</head>

<body>

<header>
  <div class="navbar">

    <a href="index.html" class="logo">
      NEKSHAR
      <span>BHAKTI KI PAHCHAN</span>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html" class="cart-link">🛒 Cart <span id="cartCount">0</span></a>
    </nav>

  </div>
</header>


<section class="cart-hero">
  <div class="small-title">NEKSHAR</div>

  <h1>Your Cart</h1>

  <div class="line"></div>

  <p>Review your selected products before placing your order.</p>
</section>


<main class="cart-container">

  <!-- CART ITEMS -->
  <div class="cart-items" id="cartItems">

    <!-- cart.js yahan products dalega -->

  </div>


  <!-- SUMMARY -->
  <aside class="summary">

    <h2>Order Summary</h2>

    <div class="summary-row">
      <span>Subtotal</span>
      <strong id="subtotal">₹0</strong>
    </div>

    <div class="summary-row">
      <span>Delivery</span>
      <strong>Free</strong>
    </div>

    <div class="summary-total">
      <span>Total</span>
      <span id="total">₹0</span>
    </div>

    <a href="order.html" class="checkout">
      Proceed to Order →
    </a>

    <a href="shop.html" class="continue">
      ← Continue Shopping
    </a>

  </aside>

</main>


<footer>
  <strong>NEKSHAR</strong><br>
  Bhakti Ki Pahchan
  <br><br>
  © 2026 Nekshar Agarbatti
</footer>


<script src="cart.js"></script>

</body>
</html>
