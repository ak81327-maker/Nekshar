<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEKSHAR AGARBATTI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 font-sans text-gray-800 pb-12">

    <!-- Header -->
    <header class="bg-amber-900 text-white p-4 shadow-md sticky top-0 z-40">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">NEKSHAR AGARBATTI</h1>
            <span class="bg-amber-800 text-xs px-3 py-1 rounded-full text-amber-200">ऑनलाइन स्टोर</span>
        </div>
    </header>

    <!-- Banner Header -->
    <section class="bg-amber-100 py-8 text-center border-b border-amber-200 px-4">
        <h2 class="text-2xl font-bold text-amber-950">नेचुरल एवं प्रीमियम अगरबत्ती</h2>
        <p class="text-amber-800 mt-1 text-sm">शुद्धता और सुगंध से भरपूर आपके घर और पूजा के लिए श्रेष्ठ विकल्प</p>
    </section>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5" id="product-grid">
            <!-- JavaScript द्वारा प्रोडक्ट लोड होंगे -->
        </div>
    </main>

    <!-- Order Modal (Popup Form) -->
    <div id="orderModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
            
            <h3 class="text-xl font-bold text-amber-950 mb-1">ऑर्डर फ़ॉर्म</h3>
            <p id="selectedProductName" class="text-sm font-semibold text-amber-800 mb-4"></p>

            <form onsubmit="sendToWhatsApp(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">आपका नाम *</label>
                    <input type="text" id="custName" required class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-amber-600" placeholder="अपना पूरा नाम लिखें">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">मोबाइल नंबर *</label>
                    <input type="tel" id="custPhone" required class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-amber-600" placeholder="10 अंकों का नंबर">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">पूरा पता *</label>
                    <textarea id="custAddress" rows="3" required class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-amber-600" placeholder="मकान नं., गली, शहर, पिनकोड"></textarea>
                </div>

                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition text-sm flex items-center justify-center gap-2 mt-2">
                    📱 व्हाट्सएप पर सीधे ऑर्डर भेजें
                </button>
            </form>
        </div>
    </div>

    <script>
        // आपके प्रोडक्ट्स
        const products = [
            { id: 1, name: "प्रीमियम चंदन अगरबत्ती", price: 150, image: "https://via.placeholder.com/300x200?text=Chandan+Agarbatti" },
            { id: 2, name: "प्राकृतिक गुलाब अगरबत्ती", price: 120, image: "https://via.placeholder.com/300x200?text=Gulab+Agarbatti" },
            { id: 3, name: "सुगंधित मोगरा अगरबत्ती", price: 130, image: "https://via.placeholder.com/300x200?text=Mogra+Agarbatti" },
            { id: 4, name: "शुद्ध गूगल धूप बत्ती", price: 200, image: "https://via.placeholder.com/300x200?text=Guggul+Dhoop" }
        ];

        let currentProduct = "";

        // प्रोडक्ट कार्ड दिखाना
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(product => `
                <div class="bg-white rounded-xl shadow-sm border border-amber-100 overflow-hidden flex flex-col justify-between">
                    <img src="${product.image}" alt="${product.name}" class="w-full h-44 object-cover">
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-semibold text-gray-900">${product.name}</h3>
                            <p class="text-amber-800 font-bold text-lg mt-1">₹${product.price}</p>
                        </div>
                        <button onclick="openModal('${product.name}', ${product.price})" class="mt-3 w-full bg-amber-800 text-white py-2 rounded-lg hover:bg-amber-900 transition font-medium text-sm">
                            अभी खरीदें
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // पॉप-अप फॉर्म खोलना
        function openModal(name, price) {
            currentProduct = `${name} (₹${price})`;
            document.getElementById('selectedProductName').innerText = "उत्पाद: " + currentProduct;
            document.getElementById('orderModal').classList.remove('hidden');
            document.getElementById('orderModal').classList.add('flex');
        }

        // पॉप-अप फॉर्म बंद करना
        function closeModal() {
            document.getElementById('orderModal').classList.add('hidden');
            document.getElementById('orderModal').classList.remove('flex');
        }

        // व्हाट्सएप पर मैसेज भेजना
        function sendToWhatsApp(event) {
            event.preventDefault();
            
            // यहाँ अपना असली व्हाट्सएप नंबर डालें (91 के साथ)
            const myPhoneNumber = "918287548936"; 

            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;

            const message = `नमस्ते! मुझे नया ऑर्डर देना है:\n\n` +
                            `*प्रोडक्ट:* ${currentProduct}\n` +
                            `*ग्राहक का नाम:* ${name}\n` +
                            `*फोन नंबर:* ${phone}\n` +
                            `*पता:* ${address}`;

            const whatsappUrl = `https://wa.me/${myPhoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
